[package]
name = "msgtrans-rust-peer"
version = "0.1.0"
edition = "2021"
publish = false
description = "msgtrans-rust QUIC peer for the Kotlin interop runs (interop/run-quic-interop.sh)"

[dependencies]
msgtrans = { version = "=2.0.0-beta.2", default-features = false, features = ["quic", "zstd", "flate2"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"

[[bin]]
name = "peer"
path = "src/main.rs"
