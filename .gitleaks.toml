# Shared gitleaks base config for all repos under ~/projects.
# - Hooks use a repo's own .gitleaks.toml when present, otherwise this file.
# - Per-repo .gitleaks.toml files are self-contained copies of this header plus
#   narrow (path + rule) allowlists for that repo's test fixtures; keep them narrow.
title = "repo config (extends gitleaks defaults; mirrors ~/projects/.tooling/gitleaks/base.toml)"

[extend]
useDefault = true

# Placeholders that our own secret-scrubbing writes back into code/docs.
[[allowlists]]
description = "scrubbed placeholders"
regexTarget = "secret"
regexes = [
  '''^(REPLACE_ME|\*\*\*REMOVED\*\*\*|<redacted>|YOUR_[A-Z0-9_]+|your[_-][a-z0-9_-]+|changeme|placeholder)$''',
  '''^SMS_\d+$''',
]

[[allowlists]]
description = "dependency lockfiles (integrity hashes)"
paths = [
  '''(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|Cargo\.lock|gradle\.lockfile|kotlin-js-store/yarn\.lock)$''',
]

# ---- repo-specific narrow allowlists (path + rule) ----

[[allowlists]]
description = "interop/test PKI and zstd identifiers"
targetRules = ["private-key", "generic-api-key"]
paths = [
  '''^interop/consumer-kotlin21/(shared/consumer/Pki|src/main/kotlin/consumer/Main)\.kt$''',
  '''^msgtrans-(websocket|quic)/src/jvmTest/kotlin/msgtrans/transport/(Wss|Quic)TestPki\.jvm\.kt$''',
  '''^interop/android-app-kotlin21/src/main/kotlin/com/netonstream/smoke/SmokeActivity\.kt$''',
  '''^msgtrans/src/nativeInterop/zstd/zstd\.c$''',
]
