name: CI

# The tests on macOS (kqueue, and JVM) and Linux x64 (epoll, io_uring, poll, and JVM), msgtrans-quic's and
# msgtrans-websocket's included, and QUIC and WebSocket interop with msgtrans-rust on Linux. msgtrans has no Windows
# target. io, quic and websocket come from Maven Central (settings.gradle.kts includes sibling checkouts only where they
# exist).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS kqueue, os: macos-14, tasks: ":msgtrans:macosArm64Test :msgtrans-quic:macosArm64Test :msgtrans-websocket:macosArm64Test :msgtrans:jvmTest", driver: "" }
          - { name: Linux epoll, os: ubuntu-latest, tasks: ":msgtrans:linuxX64Test :msgtrans-quic:linuxX64Test :msgtrans-websocket:linuxX64Test :msgtrans:jvmTest", driver: epoll }
          - { name: Linux io_uring, os: ubuntu-latest, tasks: ":msgtrans:linuxX64Test :msgtrans-quic:linuxX64Test :msgtrans-websocket:linuxX64Test", driver: iouring }
          - { name: Linux poll, os: ubuntu-latest, tasks: ":msgtrans:linuxX64Test :msgtrans-quic:linuxX64Test :msgtrans-websocket:linuxX64Test", driver: poll }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NETON_IO_DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Test
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} --no-daemon --stacktrace --continue
      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re
          tests = fails = 0; failed = []
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              s = open(f, encoding='utf-8', errors='replace').read()
              m = re.search(r'tests="(\d+)"', s); tests += int(m.group(1)) if m else 0
              for c in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', s):
                  fails += 1; failed.append(f"- {c.group(2)}.{c.group(1)}: {c.group(3)[:300]}")
          print(f"### ${{ matrix.name }}: {tests} tests, {fails} failures")
          print("\n".join(failed))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: |
            */build/test-results/**
            */build/reports/tests/**
          if-no-files-found: ignore

  interop:
    # msgtrans-kotlin over QUIC and over WebSocket (ws and wss) against msgtrans-rust 2.0.0-beta.2 (interop/rust-peer),
    # both directions, plus the rejection cases (interop/run-quic-interop.sh, interop/run-websocket-interop.sh). Fails on
    # any unexpected result.
    name: interop with msgtrans-rust (${{ matrix.driver }})
    strategy:
      fail-fast: false
      matrix:
        driver: [epoll, iouring]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NETON_IO_DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust-peer/target
          key: cargo-${{ runner.os }}-${{ hashFiles('interop/rust-peer/Cargo.lock', 'interop/rust-peer/src/**') }}
      - name: Build the Rust peer
        working-directory: interop/rust-peer
        run: cargo build --release --locked
      - name: Link the Kotlin test binaries
        run: ./gradlew :msgtrans-quic:linkDebugTestLinuxX64 :msgtrans-websocket:linkDebugTestLinuxX64 --no-daemon --stacktrace
      - name: Run the interop
        working-directory: interop
        run: |
          ./gen-certs.sh > /dev/null
          PEER="$GITHUB_WORKSPACE/interop/rust-peer/target/release/peer"
          ./run-quic-interop.sh "$GITHUB_WORKSPACE/msgtrans-quic/build/bin/linuxX64/debugTest/test.kexe" "$PEER" | tee summary.txt
          QUIC=${PIPESTATUS[0]}
          ./run-websocket-interop.sh "$GITHUB_WORKSPACE/msgtrans-websocket/build/bin/linuxX64/debugTest/test.kexe" "$PEER" | tee -a summary.txt
          WS=${PIPESTATUS[0]}
          [ "$QUIC" = 0 ] && [ "$WS" = 0 ]
      - name: Summary
        if: always()
        run: |
          { echo "### interop with msgtrans-rust (${{ matrix.driver }})"; echo '```'; grep '^== \|\[interop\] ok\|\[interop\] FAIL' interop/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-${{ matrix.driver }}
          path: |
            interop/logs/**
            interop/summary.txt
          if-no-files-found: ignore
